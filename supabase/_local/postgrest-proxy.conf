# Proxy que imita o gateway do Supabase: o @supabase/supabase-js prefixa
# todas as URLs com /rest/v1/, mas o PostgREST serve as tabelas na raiz.
# Aqui reescrevemos /rest/v1/<x> -> /<x> antes de repassar pro PostgREST.

server {
  listen 3001;
  server_name _;

  # /rest/v1/<qualquer-coisa> -> PostgREST na raiz
  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://postgrest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Acesso direto a raiz (health check / chamadas sem prefixo)
  location / {
    proxy_pass http://postgrest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
